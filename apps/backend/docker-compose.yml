# apps/backend/docker-compose.yml — paritas lokal untuk dua proses backend.
# Pakai:  cp .env.example .env   # isi kredensial
#         docker compose up --build
# api → http://localhost:8000/health ; worker meregistrasi agent_name ke LiveKit.
# Keduanya membaca .env yang SAMA (token server + worker berbagi kredensial).

services:
  api:
    build:
      context: .
      target: api
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    # /health config-blind (selalu 200) — ini liveness, bukan readiness.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    restart: unless-stopped
    # Tak ada port job masuk (outbound). Health server framework di :8081 (liveness).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Beri waktu drain saat stop (sesi voice; framework drain job di mode `start`).
    stop_grace_period: 60s
