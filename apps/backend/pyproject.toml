[project]
name = "koperasi-backend"
version = "0.1.0"
description = "Koperasi Simulator — token server + voice agent (LiveKit Agents)"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[openai]~=1.6",
    "livekit-plugins-azure~=1.6",
    "livekit-plugins-silero~=1.6",
    "livekit-api~=1.0",
    "openai~=2.0",
    "fastapi~=0.115",
    "uvicorn[standard]~=0.34",
    "python-dotenv~=1.0",
    # SIM-4: verifikasi JWT Supabase (ES256 via JWKS) sebelum mint token LiveKit.
    # `crypto` extra menarik `cryptography` (WAJIB untuk ES256; sebelumnya pyjwt
    # hanya dep transitif tanpa extra ini).
    "pyjwt[crypto]~=2.10",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "httpx~=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
# Lint hanya kode SIM-4 (verifier + endpoint + tests); worker lama tak disentuh.
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# `Depends()` / `Security()` di argument default adalah idiom resmi FastAPI (B008).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]
