# Always-on (every push/PR) guard: the RLS-bypassing service_role key must never
# land in the frontend bundle or the repo. This does NOT flag the legitimate SQL
# role name `service_role` in apps/db grants/policies — it targets the FE and the
# key's env-var name. Pair with GitHub native secret scanning + push protection
# (repo Settings → Code security) for the actual key blob.
name: guard-secrets

on: [push, pull_request]

jobs:
  no-service-role:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: service_role key must not be in the FE or the repo
        run: |
          set -euo pipefail
          # FE source must never reference it (.env.example only documents the ban).
          if git grep -nI "service_role" -- 'apps/web/' ':!apps/web/.env.example'; then
            echo "::error::apps/web must never reference service_role (it bypasses RLS)"
            exit 1
          fi
          # The key's env var must not be defined anywhere (docs may discuss it).
          if git grep -nIE "SUPABASE_SERVICE_ROLE|SERVICE_ROLE_KEY" -- . ':!.github/workflows/guard-secrets.yml' ':!*.md'; then
            echo "::error::a service_role key env var is committed — keep the service_role key out of git entirely"
            exit 1
          fi
