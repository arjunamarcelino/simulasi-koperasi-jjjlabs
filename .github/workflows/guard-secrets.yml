# Always-on guard: the RLS-bypassing service_role key must never land in the
# frontend bundle or the repo. Two layers:
#   1. This lint catches FE *references* by name and any committed *key value*
#      (new-format `sb_secret_…`, or a `SERVICE_ROLE_KEY=<value>` assignment).
#   2. Legacy JWT-format keys (`eyJ…` blobs — no literal "service_role" substring)
#      are caught by GitHub **secret scanning + push protection** (enabled on the repo).
# It does NOT flag the legitimate SQL role name `service_role` in apps/db grants,
# nor prose mentions of the ban in docs/.env.example.
name: guard-secrets

on:
  pull_request:
  push:
    branches: [main, develop] # dedupe: same-repo PRs already run via pull_request

jobs:
  no-service-role:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: service_role key must not be in the FE or the repo
        run: |
          set -euo pipefail
          # 1) FE source must never reference it (.env.example only documents the ban).
          if git grep -nI "service_role" -- 'apps/web/' ':!apps/web/.env.example'; then
            echo "::error::apps/web must never reference service_role (it bypasses RLS)"
            exit 1
          fi
          # 2) No key VALUE committed anywhere: new-format key, or an assigned env var.
          #    Assignment-shape matching lets prose ("never set SERVICE_ROLE_KEY") pass.
          if git grep -nIE "sb_secret_[A-Za-z0-9]{8}|(SUPABASE_SERVICE_ROLE|SERVICE_ROLE_KEY)[[:space:]]*=[[:space:]]*[^[:space:]]" \
               -- . ':!.github/workflows/guard-secrets.yml'; then
            echo "::error::a service_role key value / env var is committed — keep it out of git entirely"
            exit 1
          fi
