# Deploy SIM-2's migrations + seed to the hosted Supabase project.
#
# Dormant until infra provisions the project and sets the repo variable
# SUPABASE_ENABLED=true (the ignition key — set it LAST, after every secret).
# See apps/db/RUNBOOK.md for the manual provisioning steps.
#
# Trigger is push:[develop] + manual dispatch ONLY. Never switch to
# pull_request(_target): a fork PR would break (no secrets) or, with
# pull_request_target, run untrusted code WITH these deploy secrets.
name: db-deploy

on:
  push:
    branches: [develop]
    paths: ["apps/db/**", ".github/workflows/db-deploy.yml"]
  workflow_dispatch: {}

# Serialize deploys: queue a second push behind an in-flight migration, never
# cancel one mid-transaction.
concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Job-level `if` false => skipped/neutral (not a red check), so the merged-but-
    # dormant workflow can't block PRs. Do NOT mark this a required status check.
    if: ${{ vars.SUPABASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Required-reviewer gate; the deploy secrets live in this Environment only.
    environment: supabase-deploy
    defaults:
      run:
        working-directory: apps/db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      # SHA-pinned (secret-handling workflow): a moved tag must not run with our secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.117.0

      - name: Preflight — every credential present (else fail fast, not a silent no-push)
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?missing SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_DB_PASSWORD:?missing SUPABASE_DB_PASSWORD}"
          : "${PROJECT_ID:?missing SUPABASE_PROJECT_ID}"
          : "${ANON_KEY:?missing SUPABASE_ANON_KEY}"
          : "${DB_HOST:?missing SUPABASE_DB_HOST var}"

      - name: Apply migrations
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase db push

      # db push does NOT seed. Apply the idempotent catalog seed over the SESSION
      # pooler (5432) as the postgres owner (bypasses REVOKE/RLS). Password via
      # libpq env — never on the command line.
      - name: Seed catalog
        env:
          PGHOST: ${{ vars.SUPABASE_DB_HOST }}
          PGPORT: "5432"
          PGUSER: postgres.${{ secrets.SUPABASE_PROJECT_ID }}
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Smoke checks (fail-fast)
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          PGHOST: ${{ vars.SUPABASE_DB_HOST }}
          PGPORT: "5432"
          PGUSER: postgres.${{ secrets.SUPABASE_PROJECT_ID }}
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: bash supabase/smoke/run.sh
