# Backend gates: ruff lint + pytest (Supabase-JWT verifier, admin gate, rate-limit).
# The admin authorization core (require_role, /admin/me, strict is_admin parse) lives
# here, so it must run in CI. Tests need no network/real Supabase (JWKS is faked).
# REQUIRED status check (branch protection) → must run on EVERY PR, so NO paths/paths-ignore
# filter: a path-filtered required check never runs on an unrelated PR and GitHub pins it
# "Expected"/pending forever, blocking merge. `push` is limited to main/develop (open PRs
# already cover their own branches — same dedup as guard-secrets.yml).
name: backend-ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the checkout (lint/test, no repo writes).
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (frozen)
        run: uv sync --frozen
      - name: Lint
        run: uvx ruff check api/ tests/
      - name: Test
        run: uv run pytest
