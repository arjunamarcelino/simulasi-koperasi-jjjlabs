# Admin frontend gates: typecheck + lint + unit tests + production build.
# REQUIRED status check (branch protection) → must run on EVERY PR, so NO paths/paths-ignore
# filter: a path-filtered required check never runs on an unrelated PR and GitHub pins it
# "Expected"/pending forever, blocking merge. `push` is limited to main/develop (open PRs
# already cover their own branches — same dedup as guard-secrets.yml).
name: admin-ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the checkout (build/lint/test, no repo writes).
permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter admin typecheck
      - name: Lint
        run: pnpm --filter admin lint
      - name: Test
        run: pnpm --filter admin test
      - name: Build
        run: pnpm --filter admin build
