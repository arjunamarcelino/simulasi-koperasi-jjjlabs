# Admin frontend gates: typecheck + lint + unit tests + production build.
# REQUIRED check — unfiltered on purpose; rationale + branch-protection setup in
# .github/BRANCH_PROTECTION.md. (A path-filtered required check hangs "Expected" forever.)
name: admin-ci

on:
  pull_request:
  push:
    branches: [main, develop] # dedupe: same-repo PRs already run via pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the checkout (build/lint/test, no repo writes).
permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter admin typecheck
      - name: Lint
        run: pnpm --filter admin lint
      - name: Test
        run: pnpm --filter admin test
      - name: Build
        run: pnpm --filter admin build
